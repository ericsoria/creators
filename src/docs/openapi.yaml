openapi: 3.1.0
info:
  title: Creators Internal API
  version: 0.2.0
  description: Internal API foundation for creator collaboration operations.
servers:
  - url: http://localhost/api/v1
security:
  - sanctumBearer: []
paths:
  /auth/login:
    post:
      summary: Issue an operations UI API token
      operationId: loginForApiToken
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginInput'
      responses:
        '200':
          description: API token issued.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '422':
          $ref: '#/components/responses/ValidationError'
  /auth/logout:
    post:
      summary: Revoke current operations UI API token
      operationId: logoutApiToken
      security:
        - sanctumBearer: []
      responses:
        '200':
          description: Current token revoked.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /user:
    get:
      summary: Get current authenticated user
      operationId: getCurrentUser
      security:
        - sanctumBearer: []
      responses:
        '200':
          description: Current user returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /cities:
    get:
      summary: List cities
      operationId: listCities
      security:
        - sanctumBearer: []
      responses:
        '200':
          description: Cities returned.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/City'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /tags:
    get:
      summary: List tags
      operationId: listTags
      security:
        - sanctumBearer: []
      responses:
        '200':
          description: Tags returned.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Tag'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      summary: Create tag
      operationId: createTag
      security:
        - sanctumBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TagInput'
      responses:
        '201':
          description: Tag created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TagResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationError'
  /brands:
    get:
      summary: List brands
      operationId: listBrands
      security:
        - sanctumBearer: []
      parameters:
        - $ref: '#/components/parameters/StatusFilter'
        - $ref: '#/components/parameters/CityFilter'
        - $ref: '#/components/parameters/TagFilter'
        - $ref: '#/components/parameters/PerPageFilter'
      responses:
        '200':
          description: Paginated brands returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrandPaginatedResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationError'
    post:
      summary: Create brand
      operationId: createBrand
      security:
        - sanctumBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BrandInput'
      responses:
        '201':
          description: Brand created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrandResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationError'
  /brands/{brand}:
    get:
      summary: Get brand
      operationId: getBrand
      security:
        - sanctumBearer: []
      parameters:
        - $ref: '#/components/parameters/BrandPath'
      responses:
        '200':
          description: Brand returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrandResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      summary: Update brand
      operationId: updateBrand
      security:
        - sanctumBearer: []
      parameters:
        - $ref: '#/components/parameters/BrandPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BrandInput'
      responses:
        '200':
          description: Brand updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrandResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
    delete:
      summary: Delete brand
      operationId: deleteBrand
      security:
        - sanctumBearer: []
      parameters:
        - $ref: '#/components/parameters/BrandPath'
      responses:
        '204':
          description: Brand soft deleted.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /campaigns:
    get:
      summary: List campaigns
      operationId: listCampaigns
      security:
        - sanctumBearer: []
      parameters:
        - $ref: '#/components/parameters/StatusFilter'
        - $ref: '#/components/parameters/BrandFilter'
        - $ref: '#/components/parameters/TagFilter'
        - $ref: '#/components/parameters/StartsAtFilter'
        - $ref: '#/components/parameters/EndsAtFilter'
        - $ref: '#/components/parameters/PerPageFilter'
      responses:
        '200':
          description: Paginated campaigns returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CampaignPaginatedResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationError'
    post:
      summary: Create campaign
      operationId: createCampaign
      security:
        - sanctumBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CampaignInput'
      responses:
        '201':
          description: Campaign created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CampaignResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationError'
  /campaigns/{campaign}:
    get:
      summary: Get campaign
      operationId: getCampaign
      security:
        - sanctumBearer: []
      parameters:
        - $ref: '#/components/parameters/CampaignPath'
      responses:
        '200':
          description: Campaign returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CampaignResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      summary: Update campaign
      operationId: updateCampaign
      security:
        - sanctumBearer: []
      parameters:
        - $ref: '#/components/parameters/CampaignPath'
      requestBody:
        required: true
        content:
