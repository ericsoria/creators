      responses:
        '200':
          description: Campaign updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CampaignResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
    delete:
      summary: Delete campaign
      operationId: deleteCampaign
      security:
        - sanctumBearer: []
      parameters:
        - $ref: '#/components/parameters/CampaignPath'
      responses:
        '204':
          description: Campaign soft deleted.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /prospects:
    get:
      summary: List prospects
      operationId: listProspects
      security:
        - sanctumBearer: []
      parameters:
        - name: prospect_type
          in: query
          schema:
            type: string
            enum: [creator, brand]
        - $ref: '#/components/parameters/StatusFilter'
        - name: platform
          in: query
          schema:
            type: string
        - name: category
          in: query
          schema:
            type: string
        - name: source
          in: query
          schema:
            type: string
        - $ref: '#/components/parameters/PerPageFilter'
      responses:
        '200':
          description: Paginated prospects returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProspectPaginatedResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      summary: Create prospect
      operationId: createProspect
      security:
        - sanctumBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProspectInput'
      responses:
        '201':
          description: Prospect created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProspectResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationError'
  /prospects/{prospect}:
    get:
      summary: Get prospect
      operationId: getProspect
      security:
        - sanctumBearer: []
      parameters:
        - $ref: '#/components/parameters/ProspectPath'
      responses:
        '200':
          description: Prospect returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProspectResponse'
        '401':
