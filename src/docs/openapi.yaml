      summary: Get opportunity
      operationId: getOpportunity
      security:
        - sanctumBearer: []
      parameters:
        - $ref: '#/components/parameters/OpportunityPath'
      responses:
        '200':
          description: Opportunity returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpportunityResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      summary: Update opportunity
      operationId: updateOpportunity
      security:
        - sanctumBearer: []
      parameters:
        - $ref: '#/components/parameters/OpportunityPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OpportunityInput'
      responses:
        '200':
          description: Opportunity updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpportunityResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
    delete:
      summary: Delete opportunity
      operationId: deleteOpportunity
      security:
        - sanctumBearer: []
      parameters:
        - $ref: '#/components/parameters/OpportunityPath'
      responses:
        '204':
          description: Opportunity soft deleted.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /opportunities/{opportunity}/accept:
    post:
      summary: Accept opportunity
      operationId: acceptOpportunity
      security:
        - sanctumBearer: []
      parameters:
        - $ref: '#/components/parameters/OpportunityPath'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                message: { type: string, nullable: true }
                metadata: { type: object, nullable: true }
      responses:
        '200':
          description: Opportunity accepted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpportunityResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
  /opportunities/{opportunity}/events:
    get:
      summary: List opportunity events
      operationId: listOpportunityEvents
      security:
        - sanctumBearer: []
      parameters:
        - $ref: '#/components/parameters/OpportunityPath'
        - $ref: '#/components/parameters/PerPageFilter'
      responses:
        '200':
          description: Paginated opportunity events returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpportunityEventPaginatedResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      summary: Create opportunity event
      operationId: createOpportunityEvent
      security:
        - sanctumBearer: []
      parameters:
        - $ref: '#/components/parameters/OpportunityPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OpportunityEventInput'
      responses:
        '201':
          description: Opportunity event created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpportunityEventResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
components:
  securitySchemes:
    sanctumBearer:
      type: http
      scheme: bearer
      bearerFormat: Sanctum token
  parameters:
    BrandPath:
      name: brand
      in: path
      required: true
      schema:
        type: integer
    CampaignPath:
      name: campaign
      in: path
      required: true
      schema:
        type: integer
    ProspectPath:
      name: prospect
      in: path
      required: true
      schema:
        type: integer
    CreatorPath:
      name: creator
      in: path
      required: true
      schema:
        type: integer
    SocialAccountPath:
      name: social_account
      in: path
      required: true
      schema:
        type: integer
    OpportunityPath:
      name: opportunity
      in: path
      required: true
      schema:
        type: integer
    StatusFilter:
      name: status
      in: query
      required: false
      schema:
        type: string
    BrandFilter:
      name: brand
      in: query
      required: false
      schema:
        type: integer
    CityFilter:
      name: city
      in: query
      required: false
      schema:
        type: integer
    TagFilter:
      name: tag
      in: query
      required: false
      schema:
        type: integer
    StartsAtFilter:
      name: starts_at
      in: query
      required: false
      schema:
        type: string
        format: date
    EndsAtFilter:
      name: ends_at
      in: query
      required: false
      schema:
        type: string
        format: date
    PerPageFilter:
      name: per_page
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
  responses:
    Unauthorized:
      description: The request is missing a valid authentication token.
      content:
        application/json:
          schema:
            type: object
            required: [message]
            properties:
              message:
                type: string
                example: Unauthenticated.
    NotFound:
      description: The requested resource was not found.
      content:
        application/json:
          schema:
            type: object
            required: [message]
            properties:
              message:
                type: string
