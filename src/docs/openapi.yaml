        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /opportunities:
    get:
      summary: List opportunities
      operationId: listOpportunities
      security:
        - sanctumBearer: []
      parameters:
        - name: campaign
          in: query
          schema: { type: integer }
        - name: creator
          in: query
          schema: { type: integer }
        - name: status
          in: query
          schema: { type: string, enum: [draft, contacted, follow_up, interested, accepted, rejected, ghosted, expired, cancelled] }
        - name: channel
          in: query
          schema: { type: string }
        - name: assigned_to
          in: query
          schema: { type: integer }
        - name: responded
          in: query
          schema: { type: boolean }
        - name: first_contacted_at
          in: query
          schema: { type: string, format: date }
        - name: last_contacted_at
          in: query
          schema: { type: string, format: date }
        - $ref: '#/components/parameters/PerPageFilter'
      responses:
        '200':
          description: Paginated opportunities returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpportunityPaginatedResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationError'
    post:
      summary: Create opportunity
      operationId: createOpportunity
      security:
        - sanctumBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OpportunityInput'
      responses:
        '201':
          description: Opportunity created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpportunityResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationError'
  /opportunities/{opportunity}:
