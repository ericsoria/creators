      responses:
        '200':
          description: Prospect updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProspectResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
    delete:
      summary: Delete prospect
      operationId: deleteProspect
      security:
        - sanctumBearer: []
      parameters:
        - $ref: '#/components/parameters/ProspectPath'
      responses:
        '204':
          description: Prospect soft deleted.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /prospects/{prospect}/approve-as-creator:
    post:
      summary: Approve prospect as creator
      operationId: approveProspectAsCreator
      security:
        - sanctumBearer: []
      parameters:
        - $ref: '#/components/parameters/ProspectPath'
      responses:
        '201':
          description: Creator created from prospect.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreatorResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationError'
  /prospects/{prospect}/approve-as-brand:
    post:
      summary: Approve prospect as brand
      operationId: approveProspectAsBrand
      security:
        - sanctumBearer: []
      parameters:
        - $ref: '#/components/parameters/ProspectPath'
      responses:
        '201':
          description: Brand created from prospect.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrandResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationError'
  /creators:
    get:
      summary: List creators
      operationId: listCreators
      security:
        - sanctumBearer: []
      responses:
        '200':
          description: Paginated creators returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreatorPaginatedResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      summary: Create creator
      operationId: createCreator
      security:
        - sanctumBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatorInput'
      responses:
        '201':
          description: Creator created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreatorResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationError'
  /creators/{creator}:
    get:
      summary: Get creator
      operationId: getCreator
      security:
        - sanctumBearer: []
      parameters:
        - $ref: '#/components/parameters/CreatorPath'
      responses:
        '200':
          description: Creator returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreatorResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      summary: Update creator
      operationId: updateCreator
      security:
        - sanctumBearer: []
      parameters:
        - $ref: '#/components/parameters/CreatorPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatorInput'
      responses:
        '200':
          description: Creator updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreatorResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
    delete:
      summary: Delete creator
      operationId: deleteCreator
      security:
        - sanctumBearer: []
      parameters:
        - $ref: '#/components/parameters/CreatorPath'
      responses:
        '204':
          description: Creator soft deleted.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /social-accounts:
    get:
      summary: List social accounts
      operationId: listSocialAccounts
      security:
        - sanctumBearer: []
      responses:
        '200':
          description: Paginated social accounts returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SocialAccountPaginatedResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      summary: Create social account
      operationId: createSocialAccount
      security:
        - sanctumBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
